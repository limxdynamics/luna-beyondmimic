name: CPU validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-validation:
    name: Python 3.10 / offline checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install CPU validation dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            numpy==1.26.4 \
            onnx==1.16.1 \
            pre-commit==4.6.1

      - name: Run repository checks
        run: |
          # The robot description is a submodule and must not be reformatted: Apache-2.0 requires
          # modified-file notices, and a generic formatting hook is not a reason to fork it.
          python - <<'PY'
          import subprocess

          excluded = "robot_descriptions/"
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          paths = [path for path in paths if path and not path.startswith(excluded)]
          subprocess.run(["pre-commit", "run", "--files", *paths], check=True)
          PY

      - name: Run full unit test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Check the bundled reference motion is intact
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import numpy as np

          path = "motions/HU_L04_01_WAKAWAKA_an03.npy"
          motion = np.load(path, allow_pickle=True).item()
          assert sorted(motion) == ["body_names", "body_states", "dof_names", "dof_pos_vel", "fps"]

          frames = motion["body_states"].shape[0]
          assert motion["fps"] == 50, motion["fps"]
          assert len(motion["dof_names"]) == 27
          assert len(motion["body_names"]) == 28
          assert motion["dof_pos_vel"].shape == (frames, 27, 2)
          assert motion["body_states"].shape == (frames, 28, 13)
          assert np.isfinite(motion["dof_pos_vel"]).all()
          assert np.isfinite(motion["body_states"]).all()

          # append_motion_tail refuses a motion that is still moving at its last frame, so the
          # bundled one has to be static there or the documented pipeline cannot run on it.
          assert np.abs(motion["dof_pos_vel"][-1, :, 1]).max() == 0.0
          PY

      - name: Check local Markdown links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          failures = []
          for document in Path(".").rglob("*.md"):
              text = document.read_text(encoding="utf-8")
              for target in re.findall(r"\[[^\]]*\]\(([^)]+)\)", text):
                  if "://" in target or target.startswith(("#", "mailto:")):
                      continue
                  path = (document.parent / target.split("#", 1)[0]).resolve()
                  if not path.exists():
                      failures.append(f"{document}: {target}")
          if failures:
              raise SystemExit("Broken local Markdown links:\n" + "\n".join(failures))
          PY

      - name: Check source-only distribution boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          setup_source = Path("source/whole_body_tracking/setup.py").read_text(encoding="utf-8")
          assert '"Private :: Do Not Upload"' in setup_source
          for document in (
              "README.md",
              "README.zh-CN.md",
              "Install.md",
              "QuickStart.zh-CN.md",
              "CONTRIBUTING.md",
          ):
              text = Path(document).read_text(encoding="utf-8").lower()
              assert "install -e" in text
              assert "wheel" in text
          PY
